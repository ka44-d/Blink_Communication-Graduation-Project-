
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b0c">

  <title>Blink Communication - Medicine</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/general.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/needs.css">
  <link rel="stylesheet" href="../css/medicine.css">
</head>

<body>

  <main class="app-shell" id="app">

    <header class="topbar">
      <a class="brand-small" href="#" aria-label="Blink Communication">
        <span class="brand-symbol" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
        <span>Blink Communication</span>
      </a>

      <nav class="top-actions" aria-label="Settings">

        <button class="utility-button" id="caregiverBtn"
                type="button" data-i18n="caregiver">
          لوحة المرافق
        </button>

        <button class="utility-button language-button"
                id="languageBtn" type="button"
                aria-label="Change language">
          <svg class="globe-icon" viewBox="0 0 24 24"
               aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"></path>
          </svg>
          <span id="languageLabel" class="sr-only">English</span>
        </button>

        <button class="icon-button" id="themeBtn"
                type="button"
                aria-label="Toggle day and night mode"
                title="الوضع النهاري">
          <span id="themeIcon" aria-hidden="true">☾</span>
        </button>

      </nav>
    </header>

    <!-- MEDICINE PAGE -->
    <section class="needs-page medicine-page" id="medicinePage"
             aria-labelledby="medicineTitle">

      <div class="needs-heading">

        <p class="needs-eyebrow">Blink Communication</p>

        <h1 id="medicineTitle" data-i18n="medicinePageTitle">
          موعد الدواء
        </h1>

        <p class="needs-description" id="medicineStatus"
           data-i18n="medicinePageStatus" role="status">
          حان وقت الدواء الآن
        </p>

      </div>

      <!-- Navigation row -->
      <div class="needs-grid needs-navigation-grid medicine-navigation">

        <button class="need-card" id="medicineBackBtn" type="button">
          <span class="need-icon">↩️</span>
          <span class="need-label" data-i18n="needsBack">الرجوع</span>
        </button>

        <button class="need-card needs-emergency-card"
                id="medicineEmergencyBtn" type="button">
          <span class="need-icon">❗</span>
          <span class="need-label" data-i18n="emergency">
            زرار الطوارئ
          </span>
        </button>

        <button class="need-card" id="medicineNextBtn" type="button">
          <span class="need-icon">➡️</span>
          <span class="need-label" data-i18n="needsNext">التالي</span>
        </button>

      </div>

      <!-- Medicine actions -->
      <div class="needs-grid medicine-actions">

        <button class="need-card medicine-taken"
                id="medicineTakenBtn" type="button">
          <span class="need-icon">✅</span>
          <span class="need-label" data-i18n="medicineTaken">
            أخدت الدواء
          </span>
        </button>

        <button class="need-card medicine-reminder"
                id="medicineReminderBtn" type="button">
          <span class="need-icon">⏰</span>
          <span class="need-label" data-i18n="medicineReminder">
            فكرني بعد 10 دقايق
          </span>
        </button>

        <button class="need-card medicine-sos"
                id="medicineSosBtn" type="button">
          <span class="need-icon">🆘</span>
          <span class="need-label" data-i18n="medicineHelp">
            محتاج مساعدة
          </span>
        </button>

      </div>

    </section>

    <!-- EMERGENCY DIALOG -->
    <dialog class="modal" id="emergencyDialog">
      <div class="modal-inner">

        <form method="dialog">
          <button class="modal-close" type="submit"
                  aria-label="Close">×</button>
        </form>

        <div class="alert-icon" aria-hidden="true">!</div>

        <h2 data-i18n="emergencyTitle">
          حالة طارئة
        </h2>

        <p class="muted" data-i18n="emergencyText">
          اطلب المساعدة عند الحاجة.
        </p>

        <button class="primary-button" type="submit"
                formmethod="dialog" data-i18n="close"
                onclick="document.getElementById('emergencyDialog').close()">
          إغلاق
        </button>

      </div>
    </dialog>


  </main>

  <script src="../js/general/translations.js"></script>
  <script src="../js/general/shared.js"></script>
  <script src="../js/general/language.js"></script>
  <script src="../js/general/theme.js"></script>
  <script src="../js/general/navigation.js"></script>
  <script src="../js/pages/medicine.js"></script>

</body>
</html>
