
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b0c">

  <title>Blink Communication - Reset Password</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/general.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

  <main class="app-shell" id="app">

    <header class="topbar">
      <a class="brand-small" href="../index.html">
        <span class="brand-symbol">
          <span></span><span></span><span></span>
        </span>
        <span>Blink Communication</span>
      </a>

      <nav class="top-actions">
        <button class="utility-button language-button"
                id="languageBtn" type="button"
                aria-label="Change language">
          <svg class="globe-icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"></path>
          </svg>
          <span id="languageLabel" class="sr-only">English</span>
        </button>

        <button class="icon-button" id="themeBtn" type="button"
                aria-label="Toggle day and night mode">
          <span id="themeIcon">☾</span>
        </button>
      </nav>
    </header>

    <!-- RESET PASSWORD PAGE -->
    <section class="auth-view" id="resetPasswordPage">

      <div class="auth-card">

        <div class="auth-logo">B</div>

        <h1 data-i18n="resetTitle">استعادة كلمة المرور</h1>

        <p class="auth-description" data-i18n="resetDescription">
  أدخل بياناتك لاستعادة كلمة المرور.
</p>

        <form id="resetPasswordForm" class="auth-form">

          <label for="resetEmail" data-i18n="emailLabel">
  البريد الإلكتروني
</label>

          <input
            id="resetEmail"
            type="email"
            autocomplete="email"
            required
            placeholder="اكتب بريدك الإلكتروني"
            data-i18n-placeholder="emailPlaceholder"
          >

          <label for="resetCode" data-i18n="resetCodeLabel">
  كود الاستعادة
</label>

          <input
            id="resetCode"
            type="text"
            maxlength="6"
            inputmode="numeric"
            required
            placeholder="أدخل كود الاستعادة"
            data-i18n-placeholder="resetCodePlaceholder"
          >

          <label for="newPassword" data-i18n="newPasswordLabel">
  كلمة المرور الجديدة
</label>

          <input
            id="newPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
            placeholder="اكتب كلمة المرور الجديدة"
            data-i18n-placeholder="newPasswordPlaceholder"
          >

          <p class="auth-message"
             id="resetPasswordMessage"
             role="status">
          </p>

          <button class="auth-submit" type="submit" data-i18n="resetSubmit">
  استعادة كلمة المرور
</button>

         <button
  type="button"
  class="auth-text-button"
  id="resetBackToLogin"
  data-i18n="backToLogin">
  العودة لتسجيل الدخول
</button>

        </form>

        <p class="auth-footer">
          Blink Communication 
        </p>

      </div>

    </section>

  </main>

  <script src="../js/general/translations.js"></script>
  <script src="../js/general/shared.js"></script>
  <script src="../js/general/language.js"></script>
  <script src="../js/general/theme.js"></script>
  <script src="../js/general/navigation.js"></script>
  <script src="../js/pages/auth.js"></script>

</body>
</html>
